name: Deploy web application

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@house-technical-designer/web
      # Pages has to be enabled on the repository and set to build from Actions.
      # Left to the default, the step fails with a bare "Not Found" the first
      # time and every deployment after it; asking the action to enable Pages
      # turns that into something the workflow can do by itself.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # A deployment that succeeded is not a page that opens: a wrong base path
      # publishes an index.html whose script answers 404, and the pipeline stays
      # green behind a blank page.
      - name: Vérifier que la page déployée sert l'application
        run: node scripts/smoke-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
