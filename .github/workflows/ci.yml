name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository names the npm it expects; without Corepack the runner
      # uses whichever npm it shipped with, and the promise means nothing.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:schemas
      # The data has its own gate: a family naming a port nobody defined, or a
      # catalogue entry whose properties are not the ones its schema declares,
      # is wrong in a way no type-check and no unit test of the engine sees.
      - run: npm run validate:catalog
      - run: npm run validate:docs
      # The manifest says what is installed; a manifest nobody checks is a
      # manifest that describes a previous release.
      - run: npm run catalog:manifest -- --check
      # « Ajouter des fiches ne demande aucune modification de TypeScript » :
      # ce test écrit un fichier que rien n'a jamais annoncé et demande à la
      # chaîne réelle si elle le trouve. Il tourne seul parce qu'il touche le
      # dépôt pendant qu'il s'exécute.
      - run: npm run test:discovery
      # The catalogue measured at the size it is meant to reach. Not a
      # threshold — machines differ — but a run that fails loudly the day
      # indexing ten thousand entries stops finishing at all.
      - run: npm run benchmark
      - run: npm run test:coverage
      - run: npm run audit:licenses
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@house-technical-designer/web
      # The first visit pays for the initial download; a budget makes its
      # growth a decision rather than a surprise.
      - run: npm run check:bundle
      - run: npm run test:e2e:install
      # Ce que la coque coûte à l'écran, mesuré plutôt qu'estimé : une barre
      # qui repasse à deux rangées ne se voit dans aucune revue de diff.
      - run: npm run measure:shell -- --check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
