name: CI

# Une erreur par exécution, ou toutes en une seule.
#
# Tout tenait dans un job `validate` qui enchaînait quinze commandes : un
# `format:check` rouge arrêtait la course, et on ne savait ni si TypeScript
# passait, ni les schémas, ni les catalogues, ni les tests. On corrigeait, on
# relançait, on découvrait la suivante — quatre allers-retours pour quatre
# fautes qu'une seule exécution aurait pu dire ensemble.
#
# Les contrôles sont donc découpés par **ce qu'ils vérifient**, et non par ce
# qu'ils coûtent : la forme, les types, les contrats de données, les tests, le
# produit, le navigateur. Ils sont indépendants, donc parallèles, donc tous
# rapportés. `release-gate` est le seul à les attendre tous — c'est lui qu'on
# rend obligatoire sur la branche, une case au lieu de six.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repository names the npm it expects; without Corepack the runner
      # uses whichever npm it shipped with, and the promise means nothing.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # `if: always()` : la mise en forme et les règles de code sont deux
      # questions, et savoir la seconde ne doit pas dépendre de la première.
      - run: npm run lint
        if: always()

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  contracts:
    # Ce que les données promettent, et que ni les types ni les tests du moteur
    # ne voient : une famille qui nomme un port que personne ne définit, une
    # fiche dont les propriétés ne sont pas celles de son schéma, un manifeste
    # qui décrit la version d'avant.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:schemas
      - run: npm run validate:catalog
        if: always()
      - run: npm run validate:docs
        if: always()
      - run: npm run catalog:manifest -- --check
        if: always()
      # « Ajouter des fiches ne demande aucune modification de TypeScript » :
      # ce test écrit un fichier que rien n'a jamais annoncé et demande à la
      # chaîne réelle si elle le trouve. Il tourne seul parce qu'il touche le
      # dépôt pendant qu'il s'exécute.
      - run: npm run test:discovery
        if: always()

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La couverture **est** la suite, mesurée : lancer `npm test` puis
      # `test:coverage` faisait tourner deux mille quatre cents tests deux fois
      # pour le même verdict.
      - run: npm run test:coverage

  measures:
    # Ce qui se mesure plutôt que se juger : le temps que met le catalogue à la
    # taille qu'il doit atteindre, et les licences de ce qu'on embarque.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pas un seuil — les machines diffèrent — mais une exécution qui échoue
      # bruyamment le jour où indexer dix mille fiches cesse de terminer.
      - run: npm run benchmark
      - run: npm run audit:licenses
        if: always()

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@house-technical-designer/web
      # The first visit pays for the initial download; a budget makes its
      # growth a decision rather than a surprise.
      - run: npm run check:bundle
      # `if: always()` aussi, parce que la mesure de coque en dépend et qu'elle
      # est en `always()`. Sans ça, un `check:bundle` rouge sautait
      # l'installation du navigateur, et la mesure — qui, elle, s'exécutait
      # quand même — échouait sur « Executable doesn't exist ». Deux échecs
      # affichés pour une seule cause, dont le second envoie chercher un
      # problème de navigateur qui n'existe pas.
      - run: npm run test:e2e:install
        if: always()
      # Ce que la coque coûte à l'écran, mesuré plutôt qu'estimé : une barre
      # qui repasse à deux rangées ne se voit dans aucune revue de diff.
      - run: npm run measure:shell -- --check
        if: always()
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # La seule case à rendre obligatoire sur la branche : elle échoue dès qu'un
  # des six échoue, et elle ne dit rien de plus qu'eux. Le déploiement Pages
  # attend « CI », donc il attend celle-ci.
  release-gate:
    runs-on: ubuntu-latest
    needs: [format-lint, typecheck, contracts, unit, measures, build, browser]
    if: always()
    steps:
      - name: Refuser si un contrôle a échoué
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Un contrôle au moins a échoué ; voir les jobs ci-dessus."
            exit 1
          fi
          echo "Tous les contrôles sont passés."
